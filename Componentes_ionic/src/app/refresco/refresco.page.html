<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Refresco</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-refresher slot="fixed" [pullFactor]="0.5" [pullMin]="100" [pullMax]="200" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingText="Desliza para actualizar"></ion-refresher-content>
  </ion-refresher>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingText="Suelta para cargar" refreshingText="Cargando datos..." refreshingSpinner="dots"></ion-refresher-content>
  </ion-refresher>
  <ion-refresher slot="fixed" [disabled]="true" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <p>Desliza hacia abajo para probar el refresco.</p>
  <p>Hay cuatro configuraciones de ion-refresher en esta página.</p>
</ion-content>

<ion-button routerLink="/tabs/tab1" class="volver-btn">Volver</ion-button>
