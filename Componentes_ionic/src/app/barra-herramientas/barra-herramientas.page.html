<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Barra-Herramientas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h2>Tipos de barra de herramientas</h2>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-button>Inicio</ion-button></ion-buttons>
    <ion-title>Con botones</ion-title>
    <ion-buttons slot="end"><ion-button>Guardar</ion-button></ion-buttons>
  </ion-toolbar>
  <ion-toolbar><ion-searchbar placeholder="Búsqueda en toolbar"></ion-searchbar></ion-toolbar>
  <ion-toolbar color="secondary">
    <ion-segment value="todos">
      <ion-segment-button value="todos"><ion-label>Todos</ion-label></ion-segment-button>
      <ion-segment-button value="favoritos"><ion-label>Favoritos</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
  <ion-toolbar color="tertiary">
    <ion-title>Con progreso</ion-title>
    <ion-progress-bar type="indeterminate"></ion-progress-bar>
  </ion-toolbar>
</ion-content>

<ion-button routerLink="/tabs/tab1" class="volver-btn">Volver</ion-button>
