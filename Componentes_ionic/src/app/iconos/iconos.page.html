<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Iconos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h2>Tipos de iconos</h2>
  <ion-icon name="home" size="large" color="primary" aria-label="Inicio"></ion-icon>
  <ion-icon name="heart" size="large" color="danger" aria-label="Favorito"></ion-icon>
  <ion-icon name="star" size="large" color="warning" aria-label="Estrella"></ion-icon>
  <ion-icon name="logo-ionic" size="large" color="secondary" aria-label="Ionic"></ion-icon>
</ion-content>

<ion-button routerLink="/tabs/tab1" class="volver-btn">Volver</ion-button>
