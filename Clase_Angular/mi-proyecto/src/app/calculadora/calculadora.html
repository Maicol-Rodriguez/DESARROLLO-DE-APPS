<p>calculadora works!</p>
<div class="calculadora">
  <h2>Calculadora</h2>

  <div class="campo">
    <label>Número 1:</label>
    <input type="number" [(ngModel)]="numero1" placeholder="Ingrese número 1">
  </div>

  <div class="campo">
    <label>Número 2:</label>
    <input type="number" [(ngModel)]="numero2" placeholder="Ingrese número 2">
  </div>

  <div class="campo">
    <label>Operación:</label>
    <select [(ngModel)]="operacion">
      <option value="+">Suma (+)</option>
      <option value="-">Resta (-)</option>
      <option value="*">Multiplicación (*)</option>
      <option value="/">División (/)</option>
    </select>
  </div>

  <button (click)="calcular()">Calcular</button>

  <div class="resultado" *ngIf="resultado !== null">
    <h3>Resultado: {{ resultado }}</h3>
  </div>

  <div class="historial">
    <h3>Historial</h3>
    <button (click)="limpiarHistorial()" *ngIf="historial.length > 0">
      Limpiar historial
    </button>

    <ul>
      <li *ngFor="let item of historial">
        {{ item.operacion }}
      </li>
    </ul>

    <p *ngIf="historial.length === 0">Aún no hay operaciones.</p>
  </div>
</div>
